<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizBIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --bg-raised:#111113;
    --gold:#c9a227;
    --gold-bright:#e8c65a;
    --gold-dim:#8a721f;
    --text:#f1ece0;
    --text-dim:#a39c8c;
    --text-faint:#6b6558;
    --line:rgba(201,162,39,0.22);
    --line-soft:rgba(241,236,224,0.09);
    --red:#c65b4e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}
  .serif{font-family:'Playfair Display',serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; background:transparent; color:var(--text); border:none; outline:none;}
  ::selection{background:var(--gold); color:#0a0a0b;}

  #root{max-width:900px; margin:0 auto; padding:0 22px 80px;}
  .wide{max-width:1180px;}

  /* header */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 0 18px; border-bottom:1px solid var(--line);}
  .brand{font-family:'Playfair Display',serif; font-weight:700; font-size:26px; letter-spacing:0.5px; display:flex; align-items:baseline; gap:8px;}
  .brand .dot{color:var(--gold-bright);}
  .owner-lock{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:16px; transition:all .2s; background:transparent;}
  .owner-lock:hover{border-color:var(--gold); box-shadow:0 0 14px rgba(201,162,39,0.25); color:var(--gold-bright);}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .tag{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-faint);}

  /* divider / sections */
  .sep{border:none; border-top:1px solid var(--line); margin:34px 0;}
  .sep-soft{border:none; border-top:1px solid var(--line-soft); margin:20px 0;}
  section{padding:6px 0;}
  .eyebrow{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-dim); margin-bottom:10px; font-weight:600;}
  h1.hero{font-family:'Playfair Display',serif; font-weight:600; font-size:40px; line-height:1.15; margin-bottom:12px;}
  .lede{color:var(--text-dim); font-size:15.5px; line-height:1.6; max-width:620px;}

  /* test list rows (no boxes) */
  .test-row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding:20px 0; cursor:pointer;}
  .test-row:hover .test-title{color:var(--gold-bright);}
  .test-title{font-family:'Playfair Display',serif; font-size:20px; font-weight:600; transition:color .2s;}
  .test-meta{font-size:12.5px; color:var(--text-faint); margin-top:6px; letter-spacing:.3px;}
  .test-meta span{margin-right:14px;}
  .test-cta{font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); white-space:nowrap; padding-top:4px;}
  .rank-badge{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold-dim); border:1px solid var(--line); padding:3px 9px; border-radius:20px; white-space:nowrap;}

  /* ad banner */
  .ad-banner{padding:26px 0; display:flex; gap:20px; align-items:center;}
  .ad-banner img{width:120px; height:80px; object-fit:cover; border:1px solid var(--line);}
  .ad-label{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;}
  .ad-title{font-weight:600; font-size:15px; color:var(--gold-bright); margin-bottom:4px;}
  .ad-desc{font-size:13px; color:var(--text-dim); line-height:1.5;}
  .ad-link{display:inline-block; margin-top:8px; font-size:12px; color:var(--gold); border-bottom:1px solid var(--gold-dim); letter-spacing:.5px;}
  .ad-empty{padding:22px 0; color:var(--text-faint); font-size:12.5px; font-style:italic;}

  /* buttons */
  .btn{display:inline-block; padding:12px 26px; border:1px solid var(--gold); color:var(--gold-bright); font-size:13px; letter-spacing:1px; text-transform:uppercase; background:transparent; transition:all .2s; border-radius:2px;}
  .btn:hover{background:var(--gold); color:#0a0a0b;}
  .btn-solid{background:var(--gold); color:#0a0a0b; border:1px solid var(--gold);}
  .btn-solid:hover{background:var(--gold-bright); border-color:var(--gold-bright);}
  .btn-ghost{border-color:var(--line); color:var(--text-dim);}
  .btn-ghost:hover{border-color:var(--text-dim); background:transparent; color:var(--text);}
  .btn-sm{padding:8px 16px; font-size:11px;}
  .btn-danger{border-color:var(--red); color:var(--red);}
  .btn-danger:hover{background:var(--red); color:#fff;}
  .btn[disabled]{opacity:.35; pointer-events:none;}

  /* form fields */
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-faint); margin-bottom:7px;}
  .field input, .field textarea, .field select{width:100%; border-bottom:1px solid var(--line); padding:9px 2px; font-size:14.5px; color:var(--text);}
  .field textarea{resize:vertical; min-height:70px; line-height:1.5;}
  .field input:focus, .field textarea:focus, .field select:focus{border-bottom-color:var(--gold);}
  .field select option{background:#111;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px;}
  .row4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:14px;}
  @media(max-width:640px){.row2,.row3,.row4{grid-template-columns:1fr;}}

  /* symbol toolbar */
  .symbar{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 16px; padding:10px; border:1px solid var(--line-soft); background:var(--bg-raised);}
  .symbtn{width:32px; height:32px; border:1px solid var(--line); background:transparent; color:var(--gold); font-size:15px; display:flex; align-items:center; justify-content:center; border-radius:2px;}
  .symbtn:hover{background:var(--gold); color:#0a0a0b;}

  /* owner login modal */
  .modal-wrap{position:fixed; inset:0; background:rgba(0,0,0,0.78); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
  .modal{background:var(--bg-raised); border:1px solid var(--line); padding:36px 32px; width:100%; max-width:360px; text-align:center;}
  .pin-dots{display:flex; gap:12px; justify-content:center; margin:22px 0;}
  .pin-dot{width:14px; height:14px; border-radius:50%; border:1px solid var(--gold-dim);}
  .pin-dot.filled{background:var(--gold); border-color:var(--gold);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;}
  .keypad button{padding:16px 0; border:1px solid var(--line); background:transparent; color:var(--text); font-size:17px; border-radius:2px;}
  .keypad button:hover{border-color:var(--gold); color:var(--gold-bright);}
  .pin-error{color:var(--red); font-size:12px; margin-top:10px; height:14px;}

  /* nav tabs (owner dashboard) */
  .tabbar{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:28px;}
  .tabbtn{padding:12px 18px; font-size:12.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--text-faint); white-space:nowrap; border-bottom:2px solid transparent; background:transparent;}
  .tabbtn.active{color:var(--gold-bright); border-bottom-color:var(--gold);}

  /* question list in builder */
  .q-item{padding:16px 0; border-bottom:1px solid var(--line-soft);}
  .q-item .qnum{font-family:'JetBrains Mono',monospace; color:var(--gold); font-size:12px;}
  .q-item .qtext{margin:6px 0 8px; font-size:14.5px;}
  .q-opts{font-size:12.5px; color:var(--text-dim); line-height:1.9;}
  .q-opts .correct{color:var(--gold-bright);}
  .q-del{float:right; color:var(--text-faint); font-size:11px;}
  .q-del:hover{color:var(--red);}

  /* stat strip */
  .statgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:0;}
  .stat{padding:18px 20px 18px 0; border-right:1px solid var(--line-soft);}
  .stat:last-child{border-right:none;}
  .stat .n{font-family:'JetBrains Mono',monospace; font-size:26px; color:var(--gold-bright); font-weight:700;}
  .stat .l{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); margin-top:4px;}
  @media(max-width:640px){.statgrid{grid-template-columns:1fr 1fr;} .stat{border-bottom:1px solid var(--line-soft); padding-bottom:16px; margin-bottom:8px;}}

  table.datatable{width:100%; border-collapse:collapse; font-size:13px;}
  table.datatable th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--line);}
  table.datatable td{padding:9px 10px; border-bottom:1px solid var(--line-soft); color:var(--text-dim);}
  table.datatable tr td:first-child, table.datatable tr th:first-child{padding-left:0;}
  table.datatable .gold{color:var(--gold-bright); font-weight:600;}

  /* test taking header */
  .test-header{position:sticky; top:0; background:var(--bg); z-index:50; padding:14px 0 16px; border-bottom:1px solid var(--line);}
  .test-header-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .timer{font-family:'JetBrains Mono',monospace; font-size:18px; color:var(--gold-bright); letter-spacing:1px;}
  .timer.low{color:var(--red);}
  .qgrid{display:flex; flex-wrap:wrap; gap:6px;}
  .qchip{width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-family:'JetBrains Mono',monospace; border:1px solid var(--line); color:var(--text-dim); background:transparent; flex-shrink:0;}
  .qchip.attempted{background:var(--gold); color:#0a0a0b; border-color:var(--gold); font-weight:700;}
  .qchip.current{outline:1px solid var(--gold-bright); outline-offset:2px;}

  .qbody{padding:30px 0;}
  .qbody .qtext{font-family:'Times New Roman',Times,serif; font-size:21px; line-height:1.5; margin-bottom:26px;}
  .optlist{display:flex; flex-direction:column;}
  .optrow{display:flex; align-items:center; gap:14px; padding:14px 4px; border-bottom:1px solid var(--line-soft); cursor:pointer;}
  .optrow:hover{border-bottom-color:var(--gold-dim);}
  .optletter{width:26px; height:26px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; font-family:'JetBrains Mono',monospace; flex-shrink:0; color:var(--text-dim);}
  .optrow.selected .optletter{background:var(--gold); color:#0a0a0b; border-color:var(--gold);}
  .optrow.selected .opttext{color:var(--gold-bright);}
  .opttext{font-family:'Times New Roman',Times,serif;font-size:15px;}
  .test-nav{display:flex; justify-content:space-between; align-items:center; margin-top:30px; gap:12px;}

  /* score ring */
  .ring-wrap{display:flex; flex-direction:column; align-items:center; padding:30px 0 10px;}
  .ring-num{font-family:'JetBrains Mono',monospace; font-size:34px; font-weight:700; fill:var(--gold-bright);}
  .ring-den{font-family:'JetBrains Mono',monospace; font-size:13px; fill:var(--text-faint);}
  .greet-heading{font-family:'Playfair Display',serif; font-size:26px; text-align:center; margin:18px 0 8px; color:var(--gold-bright);}
  .greet-msg{text-align:center; color:var(--text-dim); font-size:14.5px; max-width:480px; margin:0 auto; line-height:1.6;}
  .result-meta{display:flex; justify-content:center; gap:36px; margin-top:26px; text-align:center;}
  .result-meta .n{font-family:'JetBrains Mono',monospace; font-size:19px; color:var(--gold-bright);}
  .result-meta .l{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); margin-top:3px;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--gold); color:#0a0a0b; padding:12px 22px; font-size:13px; font-weight:600; border-radius:3px; z-index:400; opacity:0; pointer-events:none; transition:opacity .25s;}
  .toast.show{opacity:1;}

  .center-empty{text-align:center; padding:60px 0; color:var(--text-faint); font-size:14px;}
  .breadcrumb{font-size:11.5px; color:var(--text-faint); letter-spacing:.5px; margin-bottom:18px; cursor:pointer;}
  .breadcrumb:hover{color:var(--gold);}
  .thresh-row{display:grid; grid-template-columns:110px 1fr 1fr 2fr; gap:14px; align-items:start; padding:14px 0; border-bottom:1px solid var(--line-soft);}
  @media(max-width:700px){.thresh-row{grid-template-columns:1fr 1fr;}}
  .subtle-input{border:1px solid var(--line-soft); padding:8px; font-size:13px;}

/* ===================== QUIZBIT V2 ADDITIONS ===================== */
.qb-v2-search{display:flex;gap:10px;margin:18px 0;align-items:center}
.qb-v2-search input{flex:1;border:1px solid var(--line);padding:12px 14px;color:var(--text);background:var(--bg-raised)}
.qb-v2-search button{padding:12px 18px;border:1px solid var(--gold);background:var(--gold);color:#0a0a0b;font-weight:700}
.qb-v2-cohorts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}
.qb-v2-cohort{border:1px solid var(--line-soft);padding:18px;background:var(--bg-raised);cursor:pointer}
.qb-v2-cohort:hover{border-color:var(--gold);transform:translateY(-1px)}
.qb-v2-cohort h3{font-family:'Playfair Display',serif;margin-bottom:6px}
.qb-v2-muted{color:var(--text-faint);font-size:12px}
.qb-v2-start{display:inline-block;font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase;background:var(--gold);color:#0a0a0b;padding:12px 18px;border:1px solid var(--gold);cursor:pointer}
.qb-v2-start:hover{background:var(--gold-bright);border-color:var(--gold-bright)}
.qb-v2-account{border:1px solid var(--line);padding:20px;background:var(--bg-raised);margin:18px 0}
.qb-v2-admin{max-width:1100px;margin:0 auto;padding-bottom:80px}
.qb-v2-admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.qb-v2-card{border:1px solid var(--line-soft);padding:18px;background:var(--bg-raised)}
.qb-v2-card .num{font-family:'JetBrains Mono',monospace;font-size:24px;color:var(--gold-bright);font-weight:700}
.qb-v2-form{border-top:1px solid var(--line);padding-top:24px;margin-top:24px}
.qb-v2-danger{color:var(--red);border-color:var(--red)}
.qb-v2-hidden{display:none!important}
.qb-v2-fraction{display:inline-flex;vertical-align:middle;flex-direction:column;line-height:1;text-align:center;margin:0 .15em}
.qb-v2-fraction .top{border-bottom:1px solid currentColor;padding:0 .18em .08em}
.qb-v2-fraction .bottom{padding:.08em .18em 0}
.qb-v2-question-image{max-width:100%;max-height:420px;object-fit:contain;display:block;margin:14px 0;border:1px solid var(--line-soft)}
.qb-v2-badge{display:inline-block;border:1px solid var(--line);padding:4px 8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gold)}
@media(max-width:640px){.qb-v2-search{flex-direction:column;align-items:stretch}.qb-v2-search button{width:100%}}

</style>

<body>

<script>

/*
===================== QUIZBIT V2 DATABASE SCHEMA =====================
Run the matching SQL in Supabase SQL Editor BEFORE enabling production use.

create extension if not exists "pgcrypto";

create table if not exists public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  username text unique,
  display_name text,
  role text not null default 'student' check (role in ('student','owner')),
  created_at timestamptz not null default now()
);

create table if not exists public.exam_cohorts (
  id uuid primary key default gen_random_uuid(),
  name text not null unique,
  description text default '',
  category text default '',
  active boolean not null default true,
  created_at timestamptz not null default now()
);

create table if not exists public.tests (
  id uuid primary key default gen_random_uuid(),
  cohort_id uuid not null references public.exam_cohorts(id) on delete cascade,
  title text not null,
  description text default '',
  duration_mins integer not null default 30,
  marks_correct numeric not null default 1,
  marks_wrong numeric not null default 0,
  difficulty text not null default 'Not rated',
  active boolean not null default false,
  deadline timestamptz,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);

create table if not exists public.questions (
  id uuid primary key default gen_random_uuid(),
  test_id uuid not null references public.tests(id) on delete cascade,
  position integer not null,
  question_html text not null,
  image_url text,
  option_a text not null,
  option_b text not null,
  option_c text not null,
  option_d text not null,
  correct_option text not null check (correct_option in ('A','B','C','D')),
  explanation text default '',
  created_at timestamptz not null default now()
);

create table if not exists public.attempts (
  id uuid primary key default gen_random_uuid(),
  test_id uuid not null references public.tests(id) on delete cascade,
  user_id uuid references auth.users(id) on delete set null,
  guest_name text,
  score numeric not null default 0,
  max_score numeric not null default 0,
  percentage numeric not null default 0,
  time_taken_seconds integer default 0,
  completed boolean not null default false,
  started_at timestamptz not null default now(),
  completed_at timestamptz
);

create table if not exists public.attempt_answers (
  id uuid primary key default gen_random_uuid(),
  attempt_id uuid not null references public.attempts(id) on delete cascade,
  question_id uuid not null references public.questions(id) on delete cascade,
  selected_option text,
  is_correct boolean,
  time_taken_seconds integer default 0
);

create table if not exists public.advertisers (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  active boolean not null default true,
  created_at timestamptz not null default now()
);

create table if not exists public.campaigns (
  id uuid primary key default gen_random_uuid(),
  advertiser_id uuid references public.advertisers(id) on delete cascade,
  cohort_id uuid references public.exam_cohorts(id) on delete cascade,
  title text not null,
  description text default '',
  image_url text,
  affiliate_url text not null,
  active boolean not null default true,
  created_at timestamptz not null default now()
);

create table if not exists public.analytics_events (
  id bigint generated always as identity primary key,
  user_id uuid references auth.users(id) on delete set null,
  event_name text not null,
  cohort_id uuid references public.exam_cohorts(id) on delete set null,
  test_id uuid references public.tests(id) on delete set null,
  campaign_id uuid references public.campaigns(id) on delete set null,
  source text,
  device_type text,
  metadata jsonb default '{}'::jsonb,
  created_at timestamptz not null default now()
);

-- Recommended storage bucket for question images:
-- create bucket 'question-images' with public read access only if you deliberately
-- want question images publicly accessible. Prefer signed URLs if questions are private.

-- IMPORTANT: enable RLS and write explicit policies before production.
-- The frontend must never use the service-role/secret key.
============/* ===================== STORAGE ===================== */
/* Owner access is handled by Supabase Auth; no PIN is stored in frontend code. */
let DB = { tests: [], settings: { homeAd:{}, resultsAd:{} }, analytics:{ affiliateClicks:{home:0,results:0}, retention:[] } };
let sessionStart = Date.now();

async function sget(key){ try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
async function sset(key, val){ try{ await window.storage.set(key, JSON.stringify(val), true); }catch(e){ console.error('storage set failed', e); } }

async function loadDB(){
  const tests = await sget('qb-tests');
  const settings = await sget('qb-settings');
  const analytics = await sget('qb-analytics');
  if(tests) DB.tests = tests;
  if(settings) DB.settings = settings;
  if(analytics) DB.analytics = analytics;
}
async function saveTests(){ await sset('qb-tests', DB.tests); }
async function saveSettings(){ await sset('qb-settings', DB.settings); }
async function saveAnalytics(){ await sset('qb-analytics', DB.analytics); }
async function getResults(testId){ const r = await sget('qb-results:'+testId); return r || []; }
async function saveResults(testId, arr){ await sset('qb-results:'+testId, arr); }

window.addEventListener('beforeunload', ()=>{
  const mins = (Date.now()-sessionStart)/60000;
  if(mins > 0.05){
    DB.analytics.retention = DB.analytics.retention || [];
    DB.analytics.retention.push(Number(mins.toFixed(2)));
    if(DB.analytics.retention.length>500) DB.analytics.retention.shift();
    navigator.sendBeacon && sset('qb-analytics', DB.analytics);
  }
});

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString(undefined,{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function isLive(t){ return t.active && (!t.deadline || new Date(t.deadline).getTime() > Date.now()); }
function fullMarks(t){ return (t.questions?.length||0) * (Number(t.marksCorrect)||0); }

const root = document.getElementById('root');
let VIEW = { name:'home' };
let lastFocused = null;
document.addEventListener('focusin', (e)=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') lastFocused = e.target; });

function insertSymbol(sym){
  if(!lastFocused){ toast('Click into a text field first'); return; }
  const el = lastFocused;
  const start = el.selectionStart ?? el.value.length;
  const end = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0,start) + sym + el.value.slice(end);
  el.selectionStart = el.selectionEnd = start + sym.length;
  el.focus();
  el.dispatchEvent(new Event('input'));
}

const SYMBOLS = ['∫','∬','Σ','Π','√','∛','π','θ','Δ','∞','±','≤','≥','≠','≈','∂','∇','α','β','γ','λ','μ','∈','∴','°','⁰','¹','²','³','ⁿ','ⁱ','½','⅓','×','÷','→','∵','⌊⌋','∑'];

function symbarHtml(){
  return `<div class="symbar">${SYMBOLS.map(s=>`<button type="button" class="symbtn" onclick="insertSymbol('${s.replace("'","\\'")}')">${s}</button>`).join('')}</div>`;
}

const QB = {
  cohortId: null,
  source: new URLSearchParams(location.search).get('source') || '',
  exam: new URLSearchParams(location.search).get('exam') || ''
};

function qbEscape(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function qbFraction(top,bottom){
  return `<span class="qb-v2-fraction"><span class="top">${qbEscape(top)}</span><span class="bottom">${qbEscape(bottom)}</span></span>`;
}

async function qbSession(){
  const {data} = await supabaseClient.auth.getSession();
  return data?.session || null;
}

async function qbUser(){
  const session = await qbSession();
  return session?.user || null;
}

async function qbSignIn(email,password){
  return supabaseClient.auth.signInWithPassword({email,password});
}

async function qbSignUp(email,password,username){
  const {data,error} = await supabaseClient.auth.signUp({
    email,password,
    options:{data:{username}}
  });
  if(!error && data?.user){
    await supabaseClient.from('profiles').upsert({
      id:data.user.id, username:username || null, display_name:username || null
    });
  }
  return {data,error};
}

async function qbGoogleSignIn(){
  return supabaseClient.auth.signInWithOAuth({
    provider:'google',
    options:{redirectTo:location.origin + location.pathname}
  });
}

async function qbSignOut(){
  return supabaseClient.auth.signOut();
}

async function qbGetCohorts(){
  const {data,error} = await supabaseClient
    .from('exam_cohorts')
    .select('*')
    .eq('active',true)
    .order('created_at',{ascending:false});
  return {data:data || [],error};
}

async function qbGetLatestTests(cohortId,limit=10){
  const {data,error} = await supabaseClient
    .from('tests')
    .select('*, questions(*)')
    .eq('cohort_id',cohortId)
    .eq('active',true)
    .order('created_at',{ascending:false})
    .limit(Math.min(10,limit));
  return {data:data || [],error};
}

async function qbSearchCohorts(term){
  const q = `%${String(term || '').trim()}%`;
  const {data,error} = await supabaseClient
    .from('exam_cohorts')
    .select('*')
    .eq('active',true)
    .or(`name.ilike.${q},description.ilike.${q},category.ilike.${q}`)
    .order('created_at',{ascending:false});
  return {data:data || [],error};
}

async function qbTrack(eventName, extra={}){
  try{
    const user = await qbUser();
    await supabaseClient.from('analytics_events').insert({
      user_id:user?.id || null,
      event_name:eventName,
      cohort_id:extra.cohort_id || null,
      test_id:extra.test_id || null,
      campaign_id:extra.campaign_id || null,
      source:QB.source || extra.source || null,
      device_type:/Mobi|Android/i.test(navigator.userAgent)?'mobile':'desktop',
      metadata:extra.metadata || {}
    });
  }catch(e){ console.warn('analytics event failed',e); }
}

async function qbRequireOwner(){
  const user = await qbUser();
  if(!user) return {ok:false,reason:'not_authenticated'};
  const {data,error} = await supabaseClient
    .from('profiles')
    .select('role')
    .eq('id',user.id)
    .maybeSingle();
  if(error || data?.role !== 'owner') return {ok:false,reason:'not_owner'};
  return {ok:true,user};
}

async function qbUploadQuestionImage(file){
  if(!file) return {url:null,error:null};
  const ext=(file.name.split('.').pop()||'png').toLowerCase();
  const path=`${crypto.randomUUID()}.${ext}`;
  const {error}=await supabaseClient.storage.from('question-images').upload(path,file,{
    upsert:false,contentType:file.type || undefined
  });
  if(error) return {url:null,error};
  const {data}=supabaseClient.storage.from('question-images').getPublicUrl(path);
  return {url:data?.publicUrl || null,error:null};
}

/* Owner entry point: /admin */
async function qbAdminGate(){
  const owner=await qbRequireOwner();
  if(owner.ok){
    if(typeof go==='function') go({name:'ownerDash'});
    return;
  }
  renderQBAdminLogin();
}

function renderQBAdminLogin(){
  root.innerHTML=`
  <div class="modal-wrap">
    <div class="modal">
      <div class="eyebrow">QuizBIT Admin</div>
      <h2 class="serif">Owner access</h2>
      <p class="lede" style="font-size:13px;margin:10px auto 20px;">Sign in with your QuizBIT owner account.</p>
      <div class="field"><label>Email</label><input id="qb-admin-email" type="email" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="qb-admin-password" type="password" autocomplete="current-password"></div>
      <button class="btn btn-solid" onclick="qbAdminLogin()">Sign in</button>
      <div id="qb-admin-error" class="pin-error"></div>
    </div>
  </div>`;
}

async function qbAdminLogin(){
  const email=document.getElementById('qb-admin-email')?.value.trim();
  const password=document.getElementById('qb-admin-password')?.value;
  const {error}=await qbSignIn(email,password);
  if(error){
    const e=document.getElementById('qb-admin-error');
    if(e)e.textContent=error.message;
    return;
  }
  const owner=await qbRequireOwner();
  if(!owner.ok){
    await qbSignOut();
    const e=document.getElementById('qb-admin-error');
    if(e)e.textContent='This account is not an owner account.';
    return;
  }
  go({name:'ownerDash'});
}

async function qbRouteAdmin(){
  if(location.pathname.replace(/\/+$/,'').endsWith('/admin')){
    await qbAdminGate();
    return true;
  }
  return false;
}

function adBlockHtml(ad, kind){
  if(!ad || !ad.img && !ad.desc && !ad.title){
    return `<div class="ad-empty">Sponsored space — reserved for affiliate links & promotions.</div>`;
  }
  return `<div class="ad-banner">
    ${ad.img?`<img src="${esc(ad.img)}" alt="">`:''}
    <div>
      <div class="ad-label">Sponsored</div>
      <div class="ad-title">${esc(ad.title||'')}</div>

    </div>
  </div>`;
}
async function trackClick(kind, link){
  DB.analytics.affiliateClicks = DB.analytics.affiliateClicks || {home:0,results:0};
  DB.analytics.affiliateClicks[kind] = (DB.analytics.affiliateClicks[kind]||0)+1;
  await saveAnalytics();
  window.open(link, '_blank');
}

      <div style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;">Min %</div>
      <div style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;">Max %</div>
      <div style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;">Heading / Message</div>
    </div>
    ${t.thresholds.map((th,i)=>`
      <div class="thresh-row">
        <div style="padding-top:8px; font-size:13px; text-transform:capitalize; color:var(--gold);">${th.key}</div>
        <input class="subtle-input" type="number" value="${th.min}" oninput="draft.thresholds[${i}].min=Number(this.value)">
        <input class="subtle-input" type="number" value="${th.max}" oninput="draft.thresholds[${i}].max=Number(this.value)">
        <div>
          <input class="subtle-input" style="margin-bottom:6px;width:100%;" value="${esc(th.heading)}" oninput="draft.thresholds[${i}].heading=this.value">
          <textarea class="subtle-input" style="width:100%;min-height:50px;" oninput="draft.thresholds[${i}].message=this.value">${esc(th.message)}</textarea>
        </div>
      </div>
    `).join('')}
  </section>
  <hr class="sep-soft">
  <section>
    <div class="eyebrow">Questions</div>
    ${symbarHtml()}
    <div id="qBuilderFields">
      <div class="field"><label>Question text</label><textarea id="qText" placeholder="Type the question. Use the symbol bar above for math notation."></textarea></div>
      <div class="row2">
        <div class="field"><label>Option A</label><input id="optA"></div>
        <div class="field"><label>Option B</label><input id="optB"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Option C</label><input id="optC"></div>
        <div class="field"><label>Option D</label><input id="optD"></div>
      </div>
      <div class="field">
        <label>Correct option</label>
        <select id="correctSel"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
      </div>
      <button class="btn btn-sm" onclick="addQuestion()">+ Add Question</button>
    </div>
    <div id="qList" style="margin-top:20px;">
      ${t.questions.map((q,i)=>`
        <div class="q-item">
          <span class="q-del" onclick="removeQuestion(${i})">Remove</span>
          <div class="qnum">Q${i+1}</div>
          <div class="qtext">${esc(q.text)}</div>
          <div class="q-opts">
            ${q.options.map((o,oi)=>`<div class="${oi===q.correct?'correct':''}">${'ABCD'[oi]}. ${esc(o)} ${oi===q.correct?'✓':''}</div>`).join('')}
          </div>
        </div>
      `).join('') || '<div style="color:var(--text-faint);font-size:13px;">No questions added yet.</div>'}
    </div>
  </section>
  <hr class="sep-soft">
  <section style="display:flex; gap:14px;">
    <button class="btn btn-solid" onclick="saveDraft()">Save Test</button>
    <button class="btn btn-ghost" onclick="draft=blankTest(); go({name:'ownerDash',tab:'create'})">Clear / New Test</button>
  </section>
  `;
}
function addQuestion(){
  const text = document.getElementById('qText').value.trim();
  const opts = ['optA','optB','optC','optD'].map(id=>document.getElementById(id).value.trim());
  const correct = Number(document.getElementById('correctSel').value);
  if(!text || opts.some(o=>!o)){ toast('Fill the question and all 4 options'); return; }
  draft.questions.push({id:uid(), text, options:opts, correct});
  go({name:'ownerDash',tab:'create'});
  toast('Question added');
}
function removeQuestion(i){ draft.questions.splice(i,1); go({name:'ownerDash',tab:'create'}); }
async function saveDraft(){
  if(!draft.title.trim()){ toast('Give the test a title'); return; }
  if(!draft.questions.length){ toast('Add at least one question'); return; }
  const idx = DB.tests.findIndex(x=>x.id===draft.id);
  if(idx>=0) DB.tests[idx] = draft; else DB.tests.push(draft);
  await saveTests();
  toast('Test saved');
  draft = blankTest();
  go({name:'ownerDash', tab:'tests'});
}

async function ownerTestsHtml(){
  if(!DB.tests.length) return `<div class="center-empty">No tests created yet. Go to "Create / Edit Test".</div>`;
  let rows = '';
  for(const t of DB.tests){
    const res = await getResults(t.id);
    rows += `<div class="test-row" style="cursor:default;">
      <div>
        <div class="test-title">${esc(t.title)} ${t.active?'':'<span style="color:var(--text-faint);font-size:11px;"> (inactive)</span>'}</div>
        <div class="test-meta"><span>${t.questions.length} Q</span><span>${t.durationMins} min</span><span>${res.length} candidates</span><span>Closes ${fmtDate(t.deadline)}</span></div>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn btn-sm btn-ghost" onclick="editTest('${t.id}')">Edit</button>
        <button class="btn btn-sm btn-ghost" onclick="toggleActive('${t.id}')">${t.active?'Deactivate':'Activate'}</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTest('${t.id}')">Delete</button>
      </div>
    </div>`;
  }
  return `<section>${rows}</section>`;
}
function editTest(id){ draft = JSON.parse(JSON.stringify(DB.tests.find(t=>t.id===id))); go({name:'ownerDash', tab:'create'}); }
async function toggleActive(id){ const t=DB.tests.find(t=>t.id===id); t.active=!t.active; await saveTests(); go({name:'ownerDash',tab:'tests'}); }
async function deleteTest(id){ if(!confirm('Delete this test permanently?')) return; DB.tests = DB.tests.filter(t=>t.id!==id); await saveTests(); go({name:'ownerDash',tab:'tests'}); }

async function ownerAnalyticsHtml(){
  const clicks = DB.analytics.affiliateClicks || {home:0,results:0};
  const retention = DB.analytics.retention || [];
  const avgRet = retention.length ? (retention.reduce((a,b)=>a+b,0)/retention.length).toFixed(1) : '0';
  let totalCandidates = 0;
  let perTest = '';
  for(const t of DB.tests){
    const res = await getResults(t.id);
    totalCandidates += res.length;
    const sorted = [...res].sort((a,b)=> b.score-a.score || a.timeTakenSec-b.timeTakenSec);
    const avgScore = res.length ? (res.reduce((a,b)=>a+b.score,0)/res.length).toFixed(2) : '—';
    perTest += `
      <div style="padding:22px 0; border-bottom:1px solid var(--line-soft);">
        <div class="test-title" style="font-size:16px;">${esc(t.title)}</div>
        <div class="test-meta" style="margin-bottom:12px;"><span>${res.length} candidates</span><span>Avg score ${avgScore} / ${fullMarks(t)}</span></div>
        ${res.length ? `
        <table class="datatable">
          <tr><th>Rank</th><th>Name</th><th>Score</th><th>Time Taken</th></tr>
          ${sorted.slice(0,10).map((r,i)=>`<tr><td class="gold">#${i+1}</td><td>${esc(r.name)}</td><td>${r.score}</td><td>${Math.round(r.timeTakenSec/60)}m</td></tr>`).join('')}
        </table>` : `<div style="color:var(--text-faint); font-size:12.5px;">No attempts yet.</div>`}
      </div>`;
  }
  return `
  <section>
    <div class="eyebrow">Overview</div>
    <div class="statgrid">
      <div class="stat"><div class="n">${totalCandidates}</div><div class="l">Total Candidates</div></div>
      <div class="stat"><div class="n">${clicks.home||0}</div><div class="l">Home Ad Clicks</div></div>
      <div class="stat"><div class="n">${clicks.results||0}</div><div class="l">Results Ad Clicks</div></div>
      <div class="stat"><div class="n">${avgRet}m</div><div class="l">Avg. Retention</div></div>
    </div>
  </section>
  <hr class="sep-soft">
  <section>
    <div class="eyebrow">Per-Test Leaderboards</div>
    ${perTest || '<div class="center-empty">No tests yet.</div>'}
  </section>
  `;
}
